<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" role="img" aria-label="Nothing reaches you until it clears the check" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#201936"/></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#201936">Nothing reaches you until it clears the check</text><path d="M192 100H256" fill="none" stroke="#201936" stroke-width="1.25" marker-end="url(#a)"/><path d="M448 100H536" fill="none" stroke="#201936" stroke-width="1.25" marker-end="url(#a)"/><path d="M620 128V216" fill="none" stroke="#201936" stroke-width="1.25" marker-end="url(#a)"/><path d="M524 244H452" fill="none" stroke="#201936" stroke-width="1.25" marker-end="url(#a)"/><path d="M352 204V170H580V128" fill="none" stroke="#201936" stroke-width="1.25" marker-end="url(#a)"/><path d="M352 284V352" fill="none" stroke="#201936" stroke-width="1.25" marker-end="url(#a)"/><rect x="24" y="72" width="168" height="56" rx="8" fill="none" stroke="#201936" stroke-width="1.25"/><text x="108" y="96" font-size="13" font-weight="600" fill="#201936" text-anchor="middle">1. One-line prompt</text><text x="108" y="114" font-size="11.5" font-weight="400" fill="#5f5a72" text-anchor="middle">what you type</text><rect x="256" y="72" width="192" height="56" rx="8" fill="none" stroke="#201936" stroke-width="1.25"/><text x="352" y="96" font-size="13" font-weight="600" fill="#201936" text-anchor="middle">2. Pull context</text><text x="352" y="114" font-size="11.5" font-weight="400" fill="#5f5a72" text-anchor="middle">campaign, voice, log</text><rect x="536" y="72" width="168" height="56" rx="8" fill="none" stroke="#201936" stroke-width="1.25"/><text x="620" y="96" font-size="13" font-weight="600" fill="#201936" text-anchor="middle">3. Draft</text><text x="620" y="114" font-size="11.5" font-weight="400" fill="#5f5a72" text-anchor="middle">caption + visual brief</text><rect x="524" y="216" width="192" height="56" rx="8" fill="none" stroke="#201936" stroke-width="1.25"/><text x="620" y="240" font-size="13" font-weight="600" fill="#201936" text-anchor="middle">4. Generate asset</text><text x="620" y="258" font-size="11.5" font-weight="400" fill="#5f5a72" text-anchor="middle">Magnific over MCP</text><rect x="256" y="352" width="192" height="56" rx="8" fill="none" stroke="#201936" stroke-width="1.25"/><text x="352" y="376" font-size="13" font-weight="600" fill="#201936" text-anchor="middle">Scheduled to post</text><text x="352" y="394" font-size="11.5" font-weight="400" fill="#5f5a72" text-anchor="middle">you see this one</text><polygon points="252,244 352,204 452,244 352,284" fill="#e7e0fa" stroke="#6840c8" stroke-width="2"/><text x="352" y="248" font-size="13" font-weight="600" fill="#201936" text-anchor="middle">Passes post-check?</text><text x="466" y="162" font-size="11.5" font-weight="400" fill="#5f5a72" text-anchor="middle">fails: revise the brief</text><text x="362" y="322" font-size="11.5" font-weight="400" fill="#5f5a72">passes the check</text></svg>