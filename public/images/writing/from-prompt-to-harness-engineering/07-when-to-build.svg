<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" role="img" aria-label="A harness only survives where repetition meets a decision you already make" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13"><text x="24" y="32" font-size="15" font-weight="600" fill="#201936">A harness only survives where repetition meets a decision you already make</text><text x="24" y="54" font-size="11.5" font-weight="400" fill="#5f5a72">Up: a decision outside the harness keeps the file current. Across: how often the work repeats.</text><rect x="210" y="80" width="480" height="290" rx="8" fill="none" stroke="#201936" stroke-width="1.25"/><line x1="450" x2="450" y1="80" y2="370" stroke="#ddd8ed" stroke-width="1.25"/><line x1="210" x2="690" y1="225" y2="225" stroke="#ddd8ed" stroke-width="1.25"/><rect x="450" y="80" width="240" height="145" fill="#e7e0fa" stroke="#6840c8" stroke-width="2"/><text x="466" y="120" font-size="13" font-weight="600" fill="#201936">Build the harness</text><text x="466" y="142" font-size="11.5" font-weight="400" fill="#5f5a72">repetition pays for the setup</text><text x="226" y="120" font-size="13" font-weight="600" fill="#201936">Write it down anyway</text><text x="226" y="142" font-size="11.5" font-weight="400" fill="#5f5a72">useful to you, not to the agent</text><text x="226" y="265" font-size="13" font-weight="600" fill="#201936">Just prompt</text><text x="226" y="287" font-size="11.5" font-weight="400" fill="#5f5a72">setup costs more than the task</text><text x="466" y="265" font-size="13" font-weight="600" fill="#201936">It will go stale</text><text x="466" y="287" font-size="11.5" font-weight="400" fill="#5f5a72">nothing forces you to update it</text><text x="196" y="156" font-size="11.5" font-weight="400" fill="#5f5a72" text-anchor="end">yes</text><text x="196" y="301" font-size="11.5" font-weight="400" fill="#5f5a72" text-anchor="end">no</text><text x="210" y="390" font-size="11.5" font-weight="400" fill="#5f5a72">one-off</text><text x="690" y="390" font-size="11.5" font-weight="400" fill="#5f5a72" text-anchor="end">every week</text></svg>